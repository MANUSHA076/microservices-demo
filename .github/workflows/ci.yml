name: CI

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Install Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build user-service
        run: mvn -B package
        working-directory: user-service

      - name: Build booking-service
        run: mvn -B package
        working-directory: booking-service

      - name: Build user-service Docker image
        run: docker build -t user-service ./user-service

      - name: Build booking-service Docker image
        run: docker build -t booking-service ./booking-service

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: img
        run: |
          IMAGE=${{ steps.ecr.outputs.registry }}/user-service:${{ github.sha }}
          docker build -t $IMAGE ./user-service
          docker push $IMAGE
          echo "image=$IMAGE" >> $GITHUB_OUTPUT

      - name: Get current task definition
        run: |
          aws ecs describe-task-definition --task-definition user-service --query taskDefinition > task-definition.json

      - name: Put the new image into the task definition
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: user-service
          image: ${{ steps.img.outputs.image }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: user-service
          cluster: demo-cluster
          wait-for-service-stability: true
